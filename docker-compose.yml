version: '3.8'

services:
  transferguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transferguard-platform
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen3:4b
    depends_on:
      - ollama
    volumes:
      - transferguard-data:/app/apps/api/data

  ollama:
    image: ollama/ollama:latest
    container_name: transferguard-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  transferguard-data:
  ollama-models:
